name: Release

# Called by release-please.yml after it creates a release (a tag made with
# GITHUB_TOKEN does not trigger a tag-push workflow). It first runs the security
# gates, then builds the multi-arch image (ADR 0036), pushes it to GitHub
# Container Registry, and attaches release binaries to the GitHub release.
# Manual fallback: run it from the Actions tab (workflow_dispatch) with the
# name of an existing tag, for example v0.6.0, to repeat a failed publish.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.3.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.3.
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Security gates (issue #85): a failed gate stops the release.
  gates:
    name: Security gates
    uses: ./.github/workflows/security-gates.yml

  image:
    name: Build and push image
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags follow the release tag: v1.2.3 gives 1.2.3 only. No latest or other
      # moving tag; deployments pin a version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
      # Gate the push: build the amd64 image locally and run the CI checks.
      - name: Check the image before push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: spyglass:release-check
          build-args: VERSION=${{ inputs.tag }}
          cache-from: type=gha
      - run: scripts/check-image.sh spyglass:release-check && scripts/smoke-image.sh spyglass:release-check
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Release binaries
    needs: [gates, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make ui-build
      - name: Build binaries
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/spyglass-$VERSION-$os-$arch" ./cmd/spyglass
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist/* --clobber
