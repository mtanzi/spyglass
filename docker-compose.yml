# Single-container deployment: Spyglass and Postgres (ADR 0037).
# Runbook: docs/runbook.md. Quick start for one person: docs/personal-local-setup.md.
#
# Before the first start, create config.yaml and the secret files as in the
# runbook's "First start" (it keeps secrets/ private).
# Paths and the image can be overridden from the environment or an .env file:
#   SPYGLASS_IMAGE        image to run (default: build from this directory).
#                         Pin a release: SPYGLASS_IMAGE=ghcr.io/mtanzi/spyglass:<version>
#   SPYGLASS_CONFIG_FILE  config file to mount (default: ./config.yaml)
#   SPYGLASS_SECRETS_DIR  directory that holds the secret files (default: ./secrets)
#   SPYGLASS_PORT         host port of the data plane (default: 8080)
# The LLM_PROXY_* names of 0.1.0 still work when the SPYGLASS_* name is unset.
# They are deprecated (ADR 0054).
#
# The project name stays llm-proxy: it prefixes the Postgres volume
# (llm-proxy_pgdata), and a new name would start an existing deployment on an
# empty database. The database name and user stay llmproxy for the same reason.
name: llm-proxy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llmproxy
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d llmproxy"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  spyglass:
    image: ${SPYGLASS_IMAGE:-${LLM_PROXY_IMAGE:-spyglass:local}}
    build:
      context: .
      args:
        VERSION: local
    command: ["serve"]
    environment:
      SPYGLASS_CONFIG: /etc/spyglass/config.yaml
      # Read only by the 0.1.0 image, so a rollback to it finds the config.
      # Remove with the LLM_PROXY_* aliases in 0.4.0 (ADR 0054).
      LLM_PROXY_CONFIG: /etc/spyglass/config.yaml
    volumes:
      - ${SPYGLASS_CONFIG_FILE:-${LLM_PROXY_CONFIG_FILE:-./config.yaml}}:/etc/spyglass/config.yaml:ro
    secrets: [database_url, anthropic_api_key]
    ports:
      # Data plane, on the host loopback only. Front it with Caddy or
      # `tailscale serve` for remote clients. The admin plane has no sign-in and
      # listens on loopback inside the container, so it is not published.
      - "127.0.0.1:${SPYGLASS_PORT:-${LLM_PROXY_PORT:-8080}}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 10m # matches server.drain_timeout
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  pg_password:       { file: "${SPYGLASS_SECRETS_DIR:-${LLM_PROXY_SECRETS_DIR:-./secrets}}/pg_password" }
  database_url:      { file: "${SPYGLASS_SECRETS_DIR:-${LLM_PROXY_SECRETS_DIR:-./secrets}}/database_url" }
  anthropic_api_key: { file: "${SPYGLASS_SECRETS_DIR:-${LLM_PROXY_SECRETS_DIR:-./secrets}}/anthropic_api_key" }
