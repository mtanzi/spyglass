openapi: 3.1.0
info:
  title: Spyglass admin API
  version: 0.1.0
  description: |
    Read-only JSON API of the admin plane, served on the loopback listener under
    /admin/. There is no sign-in and no CORS header. No endpoint returns prompt,
    response or tool content: only numbers, names, ids and sizes.
servers:
  - url: /
paths:
  /admin/calls:
    get:
      operationId: listCalls
      summary: Call log
      description: |
        Calls newest first, ordered by (ts, id) descending. Every query is bounded
        by a time range: `from` and `to` default to the last 24 hours. Filters
        combine with AND; a repeated parameter matches any of its values.
        Pagination is keyset, forward only: pass `next_cursor` as `cursor`.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Endpoint"
        - $ref: "#/components/parameters/Streamed"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/ErrorClass"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/AgentType"
        - $ref: "#/components/parameters/Prompt"
        - $ref: "#/components/parameters/RequestClass"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolError"
        - $ref: "#/components/parameters/LatencyMsGte"
        - $ref: "#/components/parameters/CostMicroUsdGte"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/calls/{id}:
    get:
      operationId: getCall
      summary: One call
      description: Every recorded field of one call, with its tool uses and tool results.
      parameters:
        - name: id
          in: path
          required: true
          description: Call id, a UUIDv7 in canonical form. It is also the x-request-id of the call.
          schema:
            $ref: "#/components/schemas/CallId"
      responses:
        "200":
          description: The call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/stream:
    get:
      operationId: streamCalls
      summary: Live tail of finished calls
      description: |
        Server-sent events (`text/event-stream`) of calls as they finish, with
        the call-log filters. The stream carries finished calls only, as one
        event type, `call.finished`; the `x-sse-events` extension of the 200
        response maps each event type to its schema.

        Each event is one SSE frame:

            id: <call id>
            event: call.finished
            data: <CallSummary as one line of JSON>

        The `id` is the call id, for de-duplication. There is no replay and no
        `Last-Event-ID` catch-up: after a reconnect, refetch the first page of
        `GET /admin/calls`. A comment line (`: keep-alive`) comes every 15
        seconds while no event is due. Calls finish out of order, so events are
        not ordered by `ts`. A client that reads too slowly loses events.

        Unlike the call list, the stream has no default time range: without
        `from` or `to` that side is open. A client tool's result arrives with a
        later call, so `tool_error` matches only server tools on the stream.
        The stream ends when the server shuts down.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Endpoint"
        - $ref: "#/components/parameters/Streamed"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/ErrorClass"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/AgentType"
        - $ref: "#/components/parameters/Prompt"
        - $ref: "#/components/parameters/RequestClass"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolError"
        - $ref: "#/components/parameters/LatencyMsGte"
        - $ref: "#/components/parameters/CostMicroUsdGte"
      responses:
        "200":
          description: |
            The event stream. It is sent with `Cache-Control: no-cache` and
            `X-Accel-Buffering: no`, so proxies in front do not buffer it.
          headers:
            Cache-Control:
              description: Always `no-cache`.
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              description: Always `no`.
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema:
                description: |
                  A sequence of SSE frames, each one event of this schema
                  (decoded), with keep-alive comments between them.
                $ref: "#/components/schemas/CallFinishedEvent"
          x-sse-events:
            call.finished:
              $ref: "#/components/schemas/CallFinishedEvent"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/sessions:
    get:
      operationId: listSessions
      summary: Session list
      description: |
        Sessions, which are groups of calls with the same session key, newest
        first: ordered by the time of the last call in the range, then by call id,
        descending. A session matches when at least one of its calls in the range
        satisfies the filters, and its totals cover the calls in the range. Calls
        without a session header belong to no session and are not listed. The time
        range, repeated filter parameters and the forward keyset cursor work as in
        `/admin/calls`. There is no count: a session list is short.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/ErrorClass"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/CostMicroUsdGte"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/sessions/{key}:
    get:
      operationId: getSession
      summary: One session
      description: |
        Summary, agent tree, prompts and calls (metadata only) of one session.
        The key is the session header exactly as the client sent it and can hold
        characters such as `:` or `/`: percent-encode it in the path, for example
        `team%2Fa%3A1`.
      parameters:
        - name: key
          in: path
          required: true
          description: Session key, percent-encoded.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/tool-calls:
    get:
      operationId: listToolCalls
      summary: Tool-call explorer list
      description: |
        Tool calls, each a use paired with its result when read, newest first,
        ordered by (use time, call id, index) descending; a result with no use
        sorts by the time of the result. `session` filters to one session. The
        time range applies to the use, or to the result of a `result_only` call.
        Pairing and the two thresholds are fixed: a use with no result is
        `pending` for one hour and then `use_only`, and a result is looked up to
        24 hours past `to`. Unmatched halves are a `status` value, not an error.
        There is no count.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolSource"
        - $ref: "#/components/parameters/ToolCallStatus"
        - $ref: "#/components/parameters/ToolIsError"
        - $ref: "#/components/parameters/DurationMsGte"
        - $ref: "#/components/parameters/ArgBytesGte"
        - $ref: "#/components/parameters/ResultBytesGte"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tool calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallList"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/tool-calls/summary:
    get:
      operationId: getToolSummary
      summary: Tool statistics
      description: |
        One row per (tool name, agent type) over the same filters as the
        tool-call list, without a page. `count` includes unmatched halves;
        `errors` counts results with `is_error`; the durations cover the tool
        calls that have one.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolSource"
        - $ref: "#/components/parameters/ToolCallStatus"
        - $ref: "#/components/parameters/ToolIsError"
        - $ref: "#/components/parameters/DurationMsGte"
        - $ref: "#/components/parameters/ArgBytesGte"
        - $ref: "#/components/parameters/ResultBytesGte"
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummary"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/usage:
    get:
      operationId: getUsage
      summary: Usage time series
      description: |
        Tokens, cost and latency percentiles per time bucket, computed from raw
        call rows with the call-log filters. Buckets are aligned in UTC to `grain`.
        A bucket exists only when a call falls in it: gaps are not filled. With
        `group_by`, there is one bucket per group and time. A long range can take
        several seconds.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Endpoint"
        - $ref: "#/components/parameters/Streamed"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/ErrorClass"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/AgentType"
        - $ref: "#/components/parameters/Prompt"
        - $ref: "#/components/parameters/RequestClass"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolError"
        - $ref: "#/components/parameters/LatencyMsGte"
        - $ref: "#/components/parameters/CostMicroUsdGte"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/Grain"
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSeries"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/usage/prompts:
    get:
      operationId: getPromptCosts
      summary: Cost per prompt
      description: |
        Cost of the calls that share a prompt id, computed over every call that
        matches the call-log filters, not over one page of calls. A call with no
        prompt id belongs to no prompt and is counted in `calls_without_prompt`.
        At most `limit` prompts are returned, known cost first, highest first,
        then unknown cost; `prompt_count` is the number of prompts there are, so
        a client can say when the list is shorter than the whole.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Endpoint"
        - $ref: "#/components/parameters/Streamed"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/ErrorClass"
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/Agent"
        - $ref: "#/components/parameters/AgentType"
        - $ref: "#/components/parameters/Prompt"
        - $ref: "#/components/parameters/RequestClass"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/ToolError"
        - $ref: "#/components/parameters/LatencyMsGte"
        - $ref: "#/components/parameters/CostMicroUsdGte"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The prompts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCosts"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /admin/config:
    get:
      operationId: getConfig
      summary: Providers, pricing and key names
      description: |
        Read-only view of the running config. It holds no credential, no secret
        reference, no key hash and no database URL.
      responses:
        "200":
          description: The config view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigView"
        "500":
          $ref: "#/components/responses/Error"
  /admin/openapi.json:
    get:
      operationId: getOpenAPI
      summary: This document as JSON
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    From:
      name: from
      in: query
      description: Start of the time range, inclusive, RFC 3339. Default is 24 hours before `to`.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: End of the time range, exclusive, RFC 3339. Default is now.
      schema: { type: string, format: date-time }
    Key:
      name: key
      in: query
      description: Virtual key name. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Client:
      name: client
      in: query
      description: Client name. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Provider:
      name: provider
      in: query
      description: Provider name. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Model:
      name: model
      in: query
      description: Model as the client asked for it. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Endpoint:
      name: endpoint
      in: query
      description: Request path, for example /v1/messages. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Streamed:
      name: streamed
      in: query
      description: Only streamed (true) or only non-streamed (false) calls.
      schema: { type: boolean }
    Status:
      name: status
      in: query
      description: HTTP status returned to the client. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: integer, minimum: 100, maximum: 599 } }
    ErrorClass:
      name: error_class
      in: query
      description: Error class. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Session:
      name: session
      in: query
      description: Session key.
      schema: { type: string }
    Agent:
      name: agent
      in: query
      description: Agent id.
      schema: { type: string }
    AgentType:
      name: agent_type
      in: query
      description: Agent type. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Prompt:
      name: prompt
      in: query
      description: Prompt id.
      schema: { type: string }
    RequestClass:
      name: request_class
      in: query
      description: Request class. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    Tool:
      name: tool
      in: query
      description: Calls that made a tool call with this tool name. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    ToolError:
      name: tool_error
      in: query
      description: |
        Calls that made a tool call whose paired result has this is_error value.
        Combined with `tool`, both must hold on the same tool call.
      schema: { type: boolean }
    LatencyMsGte:
      name: latency_ms_gte
      in: query
      description: Calls whose total duration is at least this many milliseconds.
      schema: { type: integer, minimum: 0, maximum: 1099511627776 }
    CostMicroUsdGte:
      name: cost_micro_usd_gte
      in: query
      description: Calls with a known cost of at least this many micro-USD.
      schema: { type: integer, minimum: 0 }
    Limit:
      name: limit
      in: query
      description: Page size. Default 50, maximum 500.
      schema: { type: integer, minimum: 1, maximum: 500 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque; do not build it.
      schema: { $ref: "#/components/schemas/Cursor" }
    ToolSource:
      name: source
      in: query
      description: Who ran the tool, `client` or `server`. Repeat to match several.
      style: form
      explode: true
      schema: { type: array, items: { type: string, enum: [client, server] } }
    ToolCallStatus:
      name: status
      in: query
      description: |
        Pairing state: `paired`, `pending` (a use with no result yet), `use_only`
        (no result after an hour) or `result_only` (a result with no use). Repeat
        to match several.
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/ToolCallStatus" } }
    ToolIsError:
      name: is_error
      in: query
      description: Only tool calls whose result is an error (true) or is not (false). A tool call with no result never matches.
      schema: { type: boolean }
    DurationMsGte:
      name: duration_ms_gte
      in: query
      description: Tool calls whose duration is at least this many milliseconds.
      schema: { type: integer, minimum: 0, maximum: 1099511627776 }
    ArgBytesGte:
      name: arg_bytes_gte
      in: query
      description: Tool calls whose arguments are at least this many bytes.
      schema: { type: integer, minimum: 0, maximum: 2147483647 }
    ResultBytesGte:
      name: result_bytes_gte
      in: query
      description: Tool calls whose result is at least this many bytes. A tool call with no result never matches.
      schema: { type: integer, minimum: 0, maximum: 2147483647 }
    GroupBy:
      name: group_by
      in: query
      description: Dimension to group the series by. Default is no grouping.
      schema: { type: string, enum: [key, model, client, provider, session, error_class] }
    Grain:
      name: grain
      in: query
      description: Width of one bucket. Default `hour`.
      schema: { type: string, enum: [minute, hour, day], default: hour }
  responses:
    Error:
      description: |
        The request failed. `error.type` is stable and the UI maps it to an inline message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Cursor:
      type: string
      minLength: 1
      description: Opaque position of the last item of a page.
    CallId:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: UUIDv7, lowercase canonical form.
    ErrorType:
      type: string
      enum: [invalid_parameter, invalid_cursor, invalid_id, not_found, internal]
      description: |
        invalid_parameter: an unknown or malformed query parameter, or a `group_by`, `grain`, `source` or `status` value outside its list (see `parameter`).
        invalid_cursor: the cursor is not one this API issued.
        invalid_id: the path id is not a call id.
        not_found: no such call, session or route.
        internal: the server failed; retry later.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type: { $ref: "#/components/schemas/ErrorType" }
            message: { type: string, description: "Text for a log, not for matching." }
            parameter:
              type: string
              description: The query parameter at fault, for invalid_parameter.
    Usage:
      type: object
      description: Token counts in disjoint columns.
      required: [input_uncached, cache_read, cache_write_5m, cache_write_1h, output, reasoning]
      properties:
        input_uncached: { type: integer }
        cache_read: { type: integer }
        cache_write_5m: { type: integer }
        cache_write_1h: { type: integer }
        output: { type: integer, description: Includes reasoning tokens. }
        reasoning: { type: integer, description: The part of output spent on reasoning. }
    CallSummary:
      type: object
      description: One row of the call log. Zero values mean not known.
      required:
        - id
        - ts
        - key
        - client
        - session_key
        - agent_id
        - provider
        - model
        - status
        - error_class
        - stop_reason
        - streamed
        - ttft_ms
        - duration_ms
        - usage
        - cost_micro_usd
        - tool_count
        - context_compacted
      properties:
        id: { $ref: "#/components/schemas/CallId" }
        ts: { type: string, format: date-time }
        key: { type: string, description: Virtual key name. }
        client: { type: string }
        session_key: { type: string }
        agent_id: { type: string }
        prompt_id: { type: string, description: Prompt id; empty when not known. }
        provider: { type: string }
        model: { type: string }
        status: { type: integer }
        error_class: { type: string }
        stop_reason: { type: string }
        streamed: { type: boolean }
        ttft_ms: { type: integer, description: Time to first token. }
        duration_ms: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        cost_micro_usd:
          type: [integer, "null"]
          description: Cost in micro-USD. Null when no price matched; unknown is not zero.
        tool_count: { type: integer, description: Tool uses carried by the call. }
        context_compacted:
          type: boolean
          description: The cache prefix resets at this call.
    CallFinishedEvent:
      type: object
      description: |
        One `call.finished` event of `GET /admin/stream`. `id` and `event` are
        the SSE fields of the frame; `data` is its data line, decoded.
      required: [id, event, data]
      properties:
        id: { $ref: "#/components/schemas/CallId" }
        event: { type: string, const: call.finished }
        data: { $ref: "#/components/schemas/CallSummary" }
    CallList:
      type: object
      required: [calls, next_cursor, count, count_capped]
      properties:
        calls:
          type: array
          items: { $ref: "#/components/schemas/CallSummary" }
        next_cursor:
          type: [string, "null"]
          description: Cursor of the next page. Null on the last page.
        count:
          type: integer
          description: Calls matching the filter, ignoring the cursor. Exact up to 10000.
        count_capped:
          type: boolean
          description: More than 10000 calls match; `count` is 10000 and the UI shows "10,000+".
    ToolUse:
      type: object
      required: [source, tool_call_id, name, arg_bytes]
      properties:
        source: { type: string, enum: [client, server] }
        tool_call_id: { type: string }
        name: { type: string }
        arg_bytes: { type: integer }
    ToolResult:
      type: object
      required: [source, tool_call_id, is_error, result_bytes]
      properties:
        source: { type: string, enum: [client, server] }
        tool_call_id: { type: string, description: The id of the use it answers. }
        is_error: { type: boolean }
        result_bytes: { type: integer }
    CallDetail:
      type: object
      description: Every recorded field of one call.
      required:
        - id
        - ts
        - key
        - client
        - client_raw
        - client_request_id
        - session_key
        - agent_id
        - parent_agent_id
        - agent_type
        - prompt_id
        - request_class
        - compaction
        - context_compacted
        - trace_id
        - family
        - endpoint
        - auth_mode
        - provider
        - model
        - upstream_request_id
        - status
        - error_class
        - error_type
        - stop_reason
        - streamed
        - ttfb_ms
        - ttft_ms
        - duration_ms
        - ended_at
        - usage
        - usage_raw
        - usage_estimated
        - extraction_partial
        - cost_micro_usd
        - pricing_version
        - prev_tool_durations
        - tool_uses
        - tool_results
      properties:
        id: { $ref: "#/components/schemas/CallId" }
        ts: { type: string, format: date-time }
        key: { type: string }
        client: { type: string }
        client_raw: { type: string }
        client_request_id: { type: string }
        session_key: { type: string }
        agent_id: { type: string }
        parent_agent_id: { type: string }
        agent_type: { type: string }
        prompt_id: { type: string }
        request_class: { type: string }
        compaction: { type: boolean }
        context_compacted: { type: boolean }
        trace_id: { type: string }
        family: { type: string }
        endpoint: { type: string }
        auth_mode: { type: string, description: proxy_key or client_passthrough. }
        provider: { type: string }
        model: { type: string }
        upstream_request_id: { type: string }
        status: { type: integer }
        error_class: { type: string }
        error_type: { type: string }
        stop_reason: { type: string }
        streamed: { type: boolean }
        ttfb_ms: { type: integer }
        ttft_ms: { type: integer }
        duration_ms: { type: integer }
        ended_at: { type: [string, "null"], format: date-time }
        usage: { $ref: "#/components/schemas/Usage" }
        usage_raw:
          description: The provider usage object as received, numbers only. Null when there was none.
          type: [object, "null"]
        usage_estimated: { type: boolean }
        extraction_partial: { type: boolean }
        cost_micro_usd: { type: [integer, "null"] }
        pricing_version: { type: string, description: The from date of the matched price. }
        prev_tool_durations: { type: string }
        tool_uses:
          type: array
          items: { $ref: "#/components/schemas/ToolUse" }
        tool_results:
          type: array
          items: { $ref: "#/components/schemas/ToolResult" }
    SessionSummary:
      type: object
      description: One session, grouped from its calls in the time range.
      required: [session_key, key, client, first_ts, last_ts, ended_at, calls, prompts, tool_calls, errors, agent_count, models, usage, cost_micro_usd, unpriced_calls]
      properties:
        session_key: { type: string }
        key: { type: string, description: Virtual key name of the session. }
        client: { type: string }
        first_ts: { type: string, format: date-time, description: Start of the first call. }
        last_ts: { type: string, format: date-time, description: Start of the newest call. }
        ended_at:
          type: string
          format: date-time
          description: Latest end of a call. A call whose end is not known counts at its start.
        calls: { type: integer }
        prompts: { type: integer, description: Distinct prompt ids of the calls. }
        tool_calls: { type: integer, description: Distinct tool call ids carried by the calls. }
        errors: { type: integer, description: Calls with an error class. }
        agent_count: { type: integer }
        models:
          type: array
          items: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
        cost_micro_usd:
          type: [integer, "null"]
          description: Sum of the known costs. Null when no call of the session has a known cost.
        unpriced_calls: { type: integer, description: Calls of the session whose cost is null. 0 when every call is priced. }
    SessionList:
      type: object
      required: [sessions, next_cursor]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        next_cursor:
          type: [string, "null"]
          description: Cursor of the next page. Null on the last page.
    Agent:
      type: object
      description: One distinct (agent id, parent agent id, agent type) of a session.
      required: [agent_id, parent_agent_id, agent_type, calls]
      properties:
        agent_id: { type: string }
        parent_agent_id: { type: string, description: Empty for the main agent. }
        agent_type: { type: string }
        calls: { type: integer }
    Prompt:
      type: object
      description: The calls of one prompt id inside a session.
      required: [prompt_id, first_ts, calls, usage, cost_micro_usd]
      properties:
        prompt_id: { type: string }
        first_ts: { type: string, format: date-time }
        calls: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        cost_micro_usd: { type: [integer, "null"] }
    SessionDetail:
      type: object
      description: A session with its agents, prompts and calls (metadata only).
      required: [summary, agents, prompts, calls]
      properties:
        summary: { $ref: "#/components/schemas/SessionSummary" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        prompts:
          type: array
          items: { $ref: "#/components/schemas/Prompt" }
        calls:
          type: array
          description: Every call of the session.
          items: { $ref: "#/components/schemas/CallSummary" }
    ToolCallStatus:
      type: string
      enum: [paired, pending, use_only, result_only]
    DurationSource:
      type: string
      enum: [header, estimated]
      description: |
        header: reported by the client in the prev_tool_durations header of the
        call that returned the result. estimated: the gap between the use and the
        result.
    ToolCall:
      type: object
      description: A tool use paired with its result. A missing half reads as null.
      required:
        - tool_call_id
        - name
        - source
        - status
        - session_key
        - agent_id
        - use_call_id
        - result_call_id
        - use_ts
        - result_ts
        - duration_ms
        - duration_source
        - is_error
        - arg_bytes
        - result_bytes
      properties:
        tool_call_id: { type: string, description: "The provider id, for example toolu_..." }
        name: { type: string, description: From the use. Empty for result_only. }
        source: { type: string, enum: [client, server] }
        status: { $ref: "#/components/schemas/ToolCallStatus" }
        session_key: { type: string }
        agent_id: { type: string }
        use_call_id:
          oneOf:
            - $ref: "#/components/schemas/CallId"
            - type: "null"
        result_call_id:
          oneOf:
            - $ref: "#/components/schemas/CallId"
            - type: "null"
        use_ts: { type: [string, "null"], format: date-time }
        result_ts: { type: [string, "null"], format: date-time }
        duration_ms:
          type: [integer, "null"]
          description: Null when no duration is known, for example for an unmatched half.
        duration_source:
          oneOf:
            - $ref: "#/components/schemas/DurationSource"
            - type: "null"
        is_error: { type: [boolean, "null"], description: Null without a result. }
        arg_bytes: { type: integer }
        result_bytes: { type: integer, description: Zero without a result. }
    ToolCallList:
      type: object
      required: [tool_calls, next_cursor]
      properties:
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        next_cursor:
          type: [string, "null"]
          description: Cursor of the next page. Null on the last page.
    ToolStat:
      type: object
      description: Statistics of one tool for one agent type.
      required: [name, agent_type, count, errors, error_rate, duration_p50_ms, duration_p95_ms, total_duration_ms]
      properties:
        name: { type: string }
        agent_type: { type: string, description: Empty when the calling agent has no type. }
        count: { type: integer, description: "Every matching tool call, unmatched halves included." }
        errors: { type: integer, description: Results with is_error. }
        error_rate: { type: number, description: errors over count; 0 for an empty row. }
        duration_p50_ms: { type: integer }
        duration_p95_ms: { type: integer }
        total_duration_ms: { type: integer }
    ToolSummary:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolStat" }
    UsageBucket:
      type: object
      description: |
        One point of the series. Unknown is not zero: tokens and cost sum what is
        known, and the counters say how many calls are not fully known.
      required:
        - start
        - group
        - calls
        - errors
        - usage
        - cost_micro_usd
        - unpriced_calls
        - estimated_calls
        - no_usage_calls
        - latency_p50_ms
        - latency_p95_ms
        - latency_p99_ms
        - cache_hit_ratio
      properties:
        start: { type: string, format: date-time, description: "Start of the bucket, UTC, aligned to the grain." }
        group: { type: string, description: Value of the group_by dimension. Empty when ungrouped or not known. }
        calls: { type: integer }
        errors: { type: integer, description: Calls with an error class. }
        usage: { $ref: "#/components/schemas/Usage" }
        cost_micro_usd: { type: integer, description: Sum over the calls with a known cost. }
        unpriced_calls: { type: integer, description: "Calls with no cost, left out of cost_micro_usd." }
        estimated_calls: { type: integer, description: "Calls whose usage was estimated, for example after a client abort." }
        no_usage_calls: { type: integer, description: Calls with no provider usage object; their tokens are zero. }
        latency_p50_ms: { type: integer, description: Zero when no call of the bucket has a duration. }
        latency_p95_ms: { type: integer }
        latency_p99_ms: { type: integer }
        cache_hit_ratio:
          type: [number, "null"]
          description: cache_read over all input columns. Null when the bucket has no input tokens.
    UsageSeries:
      type: object
      required: [group_by, grain, buckets]
      properties:
        group_by:
          type: [string, "null"]
          enum: [key, model, client, provider, session, error_class, null]
          description: The grouping used. Null when ungrouped.
        grain: { type: string, enum: [minute, hour, day] }
        buckets:
          type: array
          description: Ordered by start, then group.
          items: { $ref: "#/components/schemas/UsageBucket" }
    PromptCost:
      type: object
      description: |
        The calls that share one prompt id. Unknown is not zero: the cost sums the
        priced calls, and `unpriced_calls` counts the calls it leaves out.
      required: [prompt_id, session_key, calls, cost_micro_usd, unpriced_calls, api_equivalent]
      properties:
        prompt_id: { type: string }
        session_key: { type: string, description: "Session of the first call of the prompt. Empty when that call has none." }
        calls: { type: integer }
        cost_micro_usd:
          type: [integer, "null"]
          description: Sum over the calls with a known cost. Null when no call of the prompt is priced.
        unpriced_calls: { type: integer, description: "Calls with no cost, left out of cost_micro_usd." }
        api_equivalent:
          type: boolean
          description: A priced call went through a client_passthrough provider, so part of the cost is what the API would bill, not what the person pays.
    PromptCosts:
      type: object
      required: [prompts, prompt_count, calls_without_prompt]
      properties:
        prompts:
          type: array
          description: At most `limit` prompts. Known cost first, highest first, then unknown cost; ties by calls, then prompt id.
          items: { $ref: "#/components/schemas/PromptCost" }
        prompt_count: { type: integer, description: "Every prompt of the matching calls, including those past `limit`." }
        calls_without_prompt: { type: integer, description: "Matching calls that carry no prompt id." }
    ConfigView:
      type: object
      required: [providers, pricing, keys]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderView" }
        pricing:
          type: array
          items: { $ref: "#/components/schemas/PricingView" }
        keys:
          type: array
          items: { $ref: "#/components/schemas/KeyView" }
    ProviderView:
      type: object
      description: A provider without its credential.
      required: [name, kind, base_url, auth_mode, idle_timeout]
      properties:
        name: { type: string }
        kind: { type: string }
        base_url: { type: string }
        auth_mode: { type: string }
        idle_timeout: { type: string, description: "A whole number and a unit, for example 10m." }
    PricingView:
      type: object
      required: [provider, model, from, price]
      properties:
        provider: { type: string }
        model: { type: string }
        from: { type: string, description: "First day the price applies, YYYY-MM-DD." }
        price: { $ref: "#/components/schemas/Price" }
    Price:
      type: object
      description: Micro-USD per million tokens.
      required: [input, output, cache_read, cache_write_5m, cache_write_1h]
      properties:
        input: { type: integer }
        output: { type: integer }
        cache_read: { type: integer }
        cache_write_5m: { type: integer }
        cache_write_1h: { type: integer }
    KeyView:
      type: object
      description: A key name and its disabled flag, never its hash.
      required: [name, disabled]
      properties:
        name: { type: string }
        disabled: { type: boolean }
